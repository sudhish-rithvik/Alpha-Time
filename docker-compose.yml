services:
  db:
    image: postgres:15-alpine
    container_name: alphatime_db
    restart: always
    environment:
      POSTGRES_USER: alphatime
      POSTGRES_PASSWORD: alphatime_secret_password
      POSTGRES_DB: alphatime_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphatime_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://alphatime:alphatime_secret_password@db:5432/alphatime_db
      DATA_PROVIDER: auto
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphatime_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
